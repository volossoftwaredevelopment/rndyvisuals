<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rndyvisuals — Filmmaker</title>
    <meta
      name="description"
      content="rndyvisuals — filmmaker, available worldwide. Selected films."
    />
    <meta name="theme-color" content="#070B0F" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="./media/home-hero.jpg" fetchpriority="high" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rndyvisuals" />
    <meta property="og:title" content="rndyvisuals — Filmmaker" />
    <meta property="og:description" content="Filmmaker — available worldwide. Selected films." />
    <meta property="og:image" content="https://volossoftwaredevelopment.github.io/rndyvisuals/og.jpg" />
    <meta property="og:url" content="https://volossoftwaredevelopment.github.io/rndyvisuals/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="rndyvisuals — Filmmaker" />
    <meta name="twitter:description" content="Filmmaker — available worldwide. Selected films." />
    <meta name="twitter:image" content="https://volossoftwaredevelopment.github.io/rndyvisuals/og.jpg" />

    <script>
      document.documentElement.className += ' js'
    </script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <main id="content">
      <section class="hero" id="top" aria-label="rndyvisuals — filmmaker">
        <div class="hero__media" aria-hidden="true">
          <div class="hero__media-inner">
            <video
              class="hero__video"
              src="./media/home-hero.mp4"
              poster="./media/home-hero.jpg"
              muted
              loop
              playsinline
            ></video>
          </div>
          <div class="hero__scrim"></div>
        </div>
        <div class="hero__lockup">
          <h1 class="hero__brand display">
            <span class="hero__brand-mask"><span class="hero__brand-line">RNDY VISUALS</span></span>
          </h1>
          <p class="hero__slogan micro">FILMMAKER — AVAILABLE WORLDWIDE</p>
        </div>
        <a class="hero__cue" href="#work" data-cursor="link">
          <span class="hero__cue-icon" aria-hidden="true">↓</span> View Work
        </a>
      </section>

      <!-- sponsor marquee -->
      <section class="sponsors" aria-label="Trusted by">
        <div class="sponsors__viewport">
          <div class="sponsors__track" data-sponsors></div>
        </div>
      </section>

      <section class="work" id="work" aria-label="Selected films">
        <div class="work-grid" data-video-grid></div>
        <noscript>
          <p style="padding: 2.5rem var(--gutter); text-align: center; color: #b8c4c6">
            Enable JavaScript to watch the films, or visit
            <a style="color: #eaf0ef" href="https://www.instagram.com/rndyvisuals/">Instagram</a>.
          </p>
        </noscript>
      </section>

      <!-- our products / store -->
      <section class="section shop" id="shop" aria-labelledby="shop-title">
        <p class="eyebrow micro" data-reveal="fade-up">Our Products</p>
        <h2 class="section__title display" id="shop-title" data-reveal="headline-lines">
          LEARN THE CRAFT.
        </h2>
        <div class="shop__grid" data-shop></div>
      </section>

      <!-- client reviews -->
      <section class="section reviews" id="reviews" aria-labelledby="reviews-title">
        <p class="eyebrow micro" data-reveal="fade-up">Kind Words</p>
        <h2 class="section__title display" id="reviews-title" data-reveal="headline-lines">
          WHAT CLIENTS SAY.
        </h2>
        <div class="reviews__stage" data-reviews></div>
      </section>
    </main>
  </body>
</html>
