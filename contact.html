  <body>
    <main id="content" class="page">
      <div class="page__inner">
        <p class="eyebrow micro page__eyebrow" data-reveal="fade-up">Contact</p>
        <h1 class="page__title display" data-reveal="headline-lines">Get in touch.</h1>

            class="btn btn--lg"
            href="https://www.instagram.com/rndyvisuals/"

            rel="noopener noreferrer"

          </a>
          <a
            class="btn btn--lg"
            href="https://wa.me/306934631572"
            target="_blank"
            rel="noopener noreferrer"
            data-magnetic
          >
            <span class="btn__label" data-magnetic-label>WhatsApp +30 693 463 1572</span>
          </a>
          <a class="btn btn--lg" href="mailto:hello@rndyvisuals.com" data-magnetic>
            <span class="btn__label" data-magnetic-label>hello@rndyvisuals.com</span>
          </a>
        </div>

        <p class="page__body" data-reveal="fade-up">
          <span>We usually reply within a day or two.</span>
        </p>
      </div>
    </main>
